<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu UI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="left">

            <img src="pokemon-logo.png" class="logo">

            <p class="small-text">
                POKEMON GEN I
            </p>

            <h1>Pikachu</h1>

            <p class="description">
                Pikachu is an Electric-type Pokémon introduced
                in Generation I. Pikachu are small, chubby,
                and incredibly cute mouse-like Pokémon.
            </p>

            <div class="number">
                <span class="line"></span>
                01 / 08
            </div>

        </div>

        <div class="right">

            <div class="menu">
                ☰
            </div>

            <img src="pikachu.png" class="pikachu">

        </div>

    </div>

</body>
</html>
